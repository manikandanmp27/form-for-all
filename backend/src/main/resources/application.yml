server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: fill-for-me-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:fillformedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:FillForMeSuperSecretJwtSigningKey98765432101234567890ForAccessibilityCoPilot}
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  ai:
    provider: ${AI_PROVIDER:hybrid}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}

logging:
  level:
    root: INFO
    com.fillforme.backend: DEBUG
